<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stella — Receber STL</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <main class="receive-container">

        <header class="receive-header">
            <h1>Stella</h1>
            <p>Receber STL</p>
        </header>

        <section class="receive-content">

            <p>Seu ID para receber STL:</p>

            <div class="receive-id">
                {{ login_id }}
            </div>

            <p class="receive-username">
                {{ username }}
            </p>

            <p class="receive-description">
                Informe este ID para quem deseja enviar STL para você.
            </p>

        </section>

        <a class="back-link" href="/home">Voltar</a>

    </main>

</body>

</html>
