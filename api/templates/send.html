<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stella — Enviar STL</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <main class="send-container">

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <p class="flash-message">{{ message }}</p>
        {% endfor %}
        {% endwith %}

        <header class="send-header">
            <h1>Stella</h1>
            <p>Enviar STL</p>
        </header>

        <form class="send-form" method="POST" action="/send">

            <div class="form-group">
                <label for="recipient">ID do destinatário</label>
                <input type="number" id="recipient" name="recipient" min="1" required>
            </div>

            <div class="form-group">
                <label for="amount">Quantidade de STL</label>
                <input type="number" id="amount" name="amount" min="1" step="any" required>
            </div>

            <button type="submit">Enviar</button>

        </form>

        <a class="back-link" href="/home">Voltar</a>

    </main>

</body>

</html>
