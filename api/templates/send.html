<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stella — Enviar STL</title>
</head>
<body>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <h1>Stella</h1>

    <h2>Enviar STL</h2>

    <form method="POST" action="/send">

        <label for="recipient">ID do destinatário</label>
        <input type="number" id="recipient" name="recipient" min="1" required>

        <label for="amount">Quantidade de STL</label>
        <input type="number" id="amount" name="amount" min="1" step="any" required>

        <button type="submit">Enviar</button>

    </form>

    <br>

    <a href="/dashboard">Voltar ao dashboard</a>

</body>
</html>
