<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stella — Home</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <main class="home-container">

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <p class="flash-message">{{ message }}</p>
        {% endfor %}
        {% endwith %}

        <section class="home-balance">
            <h2>Saldo</h2>
            <p>{{ balance }} STL</p>

            <div class="balance-links">
                <a href="/balance">Ver saldo</a>
                <a href="/transactions">Transações</a>
            </div>
        </section>

        <section class="home-actions">

            <div class="action-row">
                <a class="action-button" href="/send">Enviar STL</a>
                <a class="action-button" href="/receive">Receber STL</a>
                <a class="action-button" href="/mine">Minerar</a>
            </div>

            <div class="action-row">
                <a class="action-button" href="/blocks">Blocos</a>
                <a class="action-button" href="/account">Minha conta</a>
                <a class="action-button" href="/wallet">Ver carteira</a>
            </div>

        </section>

        <a class="logout-link" href="/logout">Sair</a>

    </main>

</body>

</html>
